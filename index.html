<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BoredDotCom</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none; /* Prevents scroll/pinch zoom on mobile */
    }
    
    /* Custom Range Slider Styling */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
      margin-top: -6px;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: #d1d5db;
      border-radius: 2px;
    }
    .dark input[type=range]::-webkit-slider-runnable-track {
      background: #4b5563;
    }
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 50%;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">
  
  <!-- Canvas -->
  <canvas id="paintCanvas" class="block cursor-crosshair touch-none"></canvas>
  
  <!-- Glassmorphic Toolbar -->
  <div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 w-full max-w-3xl px-4 z-10 pointer-events-none">
    <div class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border border-gray-200 dark:border-gray-700 shadow-2xl rounded-2xl p-4 pointer-events-auto flex flex-col md:flex-row items-center justify-between gap-4 transition-colors duration-300">
      
      <!-- Logo / Title -->
      <div class="hidden md:flex flex-col items-start mr-4">
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-purple-500">BoredDotCom</h1>
        <p class="text-xs text-gray-500 dark:text-gray-400">Draw your boredom away</p>
      </div>

      <!-- Controls -->
      <div class="flex flex-wrap items-center justify-center gap-4 w-full md:w-auto">
        
        <!-- Tool Group: Colors -->
        <div class="flex items-center gap-2 bg-gray-100 dark:bg-gray-700 p-2 rounded-xl transition-colors duration-300">
          <input type="color" id="colorPicker" value="#000000" class="shadow-sm">
          <div class="h-8 w-px bg-gray-300 dark:bg-gray-600 mx-1"></div>
          <button class="color-swatch w-6 h-6 rounded-full bg-black dark:border dark:border-gray-500 shadow-sm" data-color="#000000"></button>
          <button class="color-swatch w-6 h-6 rounded-full bg-red-500 shadow-sm" data-color="#ef4444"></button>
          <button class="color-swatch w-6 h-6 rounded-full bg-blue-500 shadow-sm" data-color="#3b82f6"></button>
          <button class="color-swatch w-6 h-6 rounded-full bg-green-500 shadow-sm" data-color="#22c55e"></button>
          <button class="color-swatch w-6 h-6 rounded-full bg-white border border-gray-300 shadow-sm" data-color="#ffffff"></button>
        </div>

        <!-- Tool Group: Brush Size -->
        <div class="flex items-center gap-3 bg-gray-100 dark:bg-gray-700 p-2 rounded-xl transition-colors duration-300 w-32 md:w-40">
          <i class="bi bi-brush text-sm text-gray-500 dark:text-gray-400"></i>
          <input type="range" id="brushSize" min="1" max="50" value="5">
        </div>

        <!-- Tool Group: Actions -->
        <div class="flex items-center gap-2">
          <button id="undoBtn" class="p-2 w-10 h-10 flex items-center justify-center bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-xl transition-colors" title="Undo">
            <i class="bi bi-arrow-counterclockwise text-lg"></i>
          </button>
          <button id="redoBtn" class="p-2 w-10 h-10 flex items-center justify-center bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-xl transition-colors" title="Redo">
            <i class="bi bi-arrow-clockwise text-lg"></i>
          </button>
          <button id="clearBtn" class="p-2 w-10 h-10 flex items-center justify-center bg-red-100 text-red-600 hover:bg-red-200 dark:bg-red-500/20 dark:text-red-400 dark:hover:bg-red-500/30 rounded-xl transition-colors" title="Clear Canvas">
            <i class="bi bi-trash3 text-lg"></i>
          </button>
          <div class="h-8 w-px bg-gray-300 dark:bg-gray-600 mx-1"></div>
          <button id="themeToggleBtn" class="p-2 w-10 h-10 flex items-center justify-center bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-xl transition-colors" title="Toggle Dark/Light Mode">
            <i class="bi bi-moon-stars-fill dark:hidden text-gray-700"></i>
            <i class="bi bi-sun-fill hidden dark:block text-yellow-400"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
